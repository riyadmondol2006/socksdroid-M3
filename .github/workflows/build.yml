name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    outputs:
      version-name: ${{ steps.collect.outputs.version-name }}
      version-code: ${{ steps.collect.outputs.version-code }}
      signed: ${{ steps.collect.outputs.signed }}
    steps:
      # Full history and tags: the app version is derived from them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Release signing is optional: without these secrets the release APK is left unsigned.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build and lint
        run: ./gradlew assembleDebug assembleRelease bundleRelease lintDebug

      - name: Collect APKs
        id: collect
        run: |
          # Same scheme as app/build.gradle.kts.
          code=$(git rev-list --count HEAD)
          suffix=$(git describe --tags --match 'v[0-9]*' 2>/dev/null) && suffix=${suffix#v} \
            || suffix="$(grep -oP 'BASE_VERSION = "\K[^"]+' app/build.gradle.kts)-g$(git rev-parse --short=7 HEAD)"
          echo "version-name=$suffix" >> "$GITHUB_OUTPUT"
          echo "version-code=$code" >> "$GITHUB_OUTPUT"
          echo "signed=$HAS_SIGNING_KEY" >> "$GITHUB_OUTPUT"
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SocksDroid-M3-$suffix-debug.apk"
          for apk in app/build/outputs/apk/release/*.apk; do
            name=release
            [[ "$apk" == *unsigned* ]] && name=release-unsigned
            cp "$apk" "dist/SocksDroid-M3-$suffix-$name.apk"
          done
          # App bundle for Google Play (signed only when the signing secrets are set).
          cp app/build/outputs/bundle/release/app-release.aab "dist/SocksDroid-M3-$suffix-release.aab"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: SocksDroid-M3-build
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Every push to master and every v* tag is published on the Releases page.
  release:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SocksDroid-M3-build
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version-name }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=$GITHUB_REF_NAME
          else
            # build-* tags don't match v*, so they never affect the app's versionName.
            tag=build-$VERSION_CODE
          fi
          if [[ "$SIGNED" == true ]]; then
            install="Install \`SocksDroid-M3-$VERSION_NAME-release.apk\`. The \`.aab\` is for Google Play."
          else
            install="Release signing isn't configured, so install the \`-debug.apk\`. The unsigned release APK and \`.aab\` can't be installed as they are."
          fi
          notes=$(printf 'Version %s (code %s), built from %s.\n\n%s' "$VERSION_NAME" "$VERSION_CODE" "${GITHUB_SHA::7}" "$install")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "SocksDroid M3 $VERSION_NAME" --notes "$notes"
          fi
